name: P0 bootstrap diagnostics

on:
  push:
    branches:
      - candidate/p0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sub-tool-compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Unpack and compare published sub-tool binaries
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/upx" "$RUNNER_TEMP/sub-tool"
          curl -fsSL https://github.com/upx/upx/releases/download/v5.0.2/upx-5.0.2-amd64_linux.tar.xz | tar -xJ -C "$RUNNER_TEMP/upx" --strip-components=1
          for version in 0.1.17 0.1.18; do
            binary="binaries/sub-tool/sub-tool-v${version}-linux-x86_64"
            target="$RUNNER_TEMP/sub-tool/sub-tool-${version}"
            cp "$binary" "$target"
            "$RUNNER_TEMP/upx/upx" -d "$target"
            chmod +x "$target"
            file "$target"
            "$target" --version || true
            "$target" --help || true
            strings "$target" > "$RUNNER_TEMP/sub-tool/sub-tool-${version}.strings"
          done
          diff -u "$RUNNER_TEMP/sub-tool/sub-tool-0.1.17.strings" "$RUNNER_TEMP/sub-tool/sub-tool-0.1.18.strings" || true

      - name: Compare profile scope behavior
        run: |
          set -euo pipefail
          printf '%s\n' 'ss://YWVzLTI1Ni1nY206cGFzczBAZXhhbXBsZS5jb206NDQz#Node' > "$RUNNER_TEMP/sub-tool/input.txt"
          for version in 0.1.17 0.1.18; do
            "$RUNNER_TEMP/sub-tool/sub-tool-${version}" parse-uri-lines \
              --input "$RUNNER_TEMP/sub-tool/input.txt" \
              --output "$RUNNER_TEMP/sub-tool/output-${version}.jsonl" \
              --format fancyss \
              --group Example \
              --source-tag example \
              --profile-id alpha \
              --source-url-hash abcd
          done
          diff -u "$RUNNER_TEMP/sub-tool/output-0.1.17.jsonl" "$RUNNER_TEMP/sub-tool/output-0.1.18.jsonl" || true

      - name: Upload unpacked binaries
        uses: actions/upload-artifact@v4
        with:
          name: sub-tool-comparison
          path: |
            ${{ runner.temp }}/sub-tool/sub-tool-0.1.17
            ${{ runner.temp }}/sub-tool/sub-tool-0.1.18
            ${{ runner.temp }}/sub-tool/*.strings
            ${{ runner.temp }}/sub-tool/output-*.jsonl
          retention-days: 3

  sub-tool-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zig 0.15.2
        run: |
          mkdir -p "$RUNNER_TEMP/zig"
          curl -fsSL https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz | tar -xJ -C "$RUNNER_TEMP/zig" --strip-components=1

      - name: Run sub-tool tests
        working-directory: tool/sub-tool
        run: $RUNNER_TEMP/zig/zig build test

      - name: Verify recovered 0.1.18 behavior
        working-directory: tool/sub-tool
        run: |
          set -euo pipefail
          ZIG="$RUNNER_TEMP/zig/zig" bash scripts/build-release.sh --no-upx x86_64
          binary="dist/sub-tool-v0.1.18-linux-x86_64"
          test "$("$binary" --version)" = "0.1.18"
          printf '%s\n' 'ss://YWVzLTI1Ni1nY206cGFzczBAZXhhbXBsZS5jb206NDQz#Node' > "$RUNNER_TEMP/sub-tool-input.txt"
          "$binary" parse-uri-lines \
            --input "$RUNNER_TEMP/sub-tool-input.txt" \
            --output "$RUNNER_TEMP/sub-tool-output.jsonl" \
            --format fancyss \
            --group Example \
            --source-tag example \
            --profile-id alpha \
            --source-url-hash abcd
          OUTPUT_PATH="$RUNNER_TEMP/sub-tool-output.jsonl" python3 -c 'import json, os; node=json.load(open(os.environ["OUTPUT_PATH"])); assert node["_source_scope"] == "profile_alpha"; assert node["_identity_primary"] == "2a66c9dd"; assert node["_identity_secondary"] == "ef8422c2"'
