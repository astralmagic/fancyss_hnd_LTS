name: Build Zig tools

on:
  pull_request:
    branches:
      - lts
    paths:
      - 'tool/sub-tool/**'
      - 'tool/node-tool/**'
      - 'binaries/zig-linux-compat.sh'
      - 'binaries/Makefile'
      - '.github/workflows/build-zig-tools.yml'
  push:
    branches:
      - lts
    paths:
      - 'tool/sub-tool/**'
      - 'tool/node-tool/**'
      - 'binaries/zig-linux-compat.sh'
      - 'binaries/Makefile'
      - '.github/workflows/build-zig-tools.yml'
  workflow_dispatch:
    inputs:
      tools:
        description: 'Makefile targets to build (default: update_sub_tool update_node_tool)'
        required: false
        default: 'update_sub_tool update_node_tool'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build and verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq xz-utils file binutils qemu-user

      - name: Install Zig 0.15.2 outside PATH
        run: |
          set -euo pipefail
          zig_meta="$(curl -fsSL https://ziglang.org/download/index.json | jq -r '.["0.15.2"]["x86_64-linux"] | "\(.tarball)\t\(.shasum)"')"
          zig_url="${zig_meta%%$'\t'*}"
          zig_sha="${zig_meta#*$'\t'}"
          test -n "$zig_url"
          test -n "$zig_sha"
          curl -fsSL "$zig_url" -o "$RUNNER_TEMP/zig.tar.xz"
          echo "${zig_sha}  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          sudo rm -rf /opt/zig-0.15.2
          sudo mkdir -p /opt/zig-0.15.2
          sudo tar -xJf "$RUNNER_TEMP/zig.tar.xz" --strip-components=1 -C /opt/zig-0.15.2
          rm -f "$RUNNER_TEMP/zig.tar.xz"
          test "$(/opt/zig-0.15.2/zig version)" = "0.15.2"
          if command -v zig >/dev/null 2>&1; then
            echo "zig must not be on PATH during wrapped builds" >&2
            exit 1
          fi

      - name: Install UPX 4.2.4 and 5.0.2
        run: |
          set -euo pipefail
          for ver in 4.2.4 5.0.2; do
            arc="upx-${ver}-amd64_linux.tar.xz"
            curl -fsSL "https://github.com/upx/upx/releases/download/v${ver}/${arc}" -o "$RUNNER_TEMP/${arc}"
            tar -xJf "$RUNNER_TEMP/${arc}" -C "$RUNNER_TEMP"
            sudo install -m 0755 "$RUNNER_TEMP/upx-${ver}-amd64_linux/upx" "/usr/local/bin/upx-${ver}"
            rm -rf "$RUNNER_TEMP/${arc}" "$RUNNER_TEMP/upx-${ver}-amd64_linux"
          done
          test "$(upx-4.2.4 --version | sed -n '1s/^upx //p')" = "4.2.4"
          test "$(upx-5.0.2 --version | sed -n '1s/^upx //p')" = "5.0.2"

      - name: Run Zig unit tests
        run: |
          set -euo pipefail
          targets="${{ inputs.tools || 'update_sub_tool update_node_tool' }}"
          case " ${targets} " in
            *" update_sub_tool "*) (cd tool/sub-tool && /opt/zig-0.15.2/zig build test) ;;
          esac
          case " ${targets} " in
            *" update_node_tool "*) (cd tool/node-tool && /opt/zig-0.15.2/zig build test) ;;
          esac
          case " ${targets} " in
            *" update_geotool "*) grep -q '"test"' tool/geotool/build.zig && (cd tool/geotool && /opt/zig-0.15.2/zig build test) || true ;;
          esac
          case " ${targets} " in
            *" update_anytls_zig "*) grep -q '"test"' tool/anytls-zig/build.zig && (cd tool/anytls-zig && /opt/zig-0.15.2/zig build test) || true ;;
          esac
          case " ${targets} " in
            *" update_status_tool "*) grep -q '"test"' tool/status-tool/build.zig && (cd tool/status-tool && /opt/zig-0.15.2/zig build test) || true ;;
          esac
          case " ${targets} " in
            *" update_webtest_tool "*) grep -q '"test"' tool/webtest-tool/build.zig && (cd tool/webtest-tool && /opt/zig-0.15.2/zig build test) || true ;;
          esac

      - name: Self-test zig-linux-compat wrapper
        run: |
          set -euo pipefail
          bash -n binaries/zig-linux-compat.sh
          case "$(REAL_ZIG=/bin/echo binaries/zig-linux-compat.sh build-exe -target x86_64-linux-musl)" in
            *"-target x86_64-linux.4.1.0...4.1.0-musl"*) ;;
            *) echo "x86_64 rewrite failed" >&2; exit 1 ;;
          esac
          case "$(REAL_ZIG=/bin/echo binaries/zig-linux-compat.sh build-exe -target arm-linux-musleabi -mcpu=arm926ej_s)" in
            *"-target arm-linux.2.6.36...2.6.36-musleabi"*) ;;
            *) echo "armv5te (arm926ej_s) rewrite failed" >&2; exit 1 ;;
          esac
          case "$(REAL_ZIG=/bin/echo binaries/zig-linux-compat.sh build-exe -target arm-linux-musleabi -mcpu=arm1176jzf_s)" in
            *"-target arm-linux.2.6.36...2.6.36-musleabi"*) ;;
            *) echo "armv5te (arm1176jzf_s) rewrite failed" >&2; exit 1 ;;
          esac
          case "$(REAL_ZIG=/bin/echo binaries/zig-linux-compat.sh build-exe -target arm-linux-musleabi -mcpu=mpcorenovfp)" in
            *"-target arm-linux.4.1.0...4.1.0-musleabi"*) ;;
            *) echo "armv7a rewrite failed" >&2; exit 1 ;;
          esac
          case "$(REAL_ZIG=/bin/echo binaries/zig-linux-compat.sh build-exe -target arm-linux-musleabihf -mcpu=cortex_a9)" in
            *"-target arm-linux.4.1.0...4.1.0-musleabihf"*) ;;
            *) echo "armv7hf rewrite failed" >&2; exit 1 ;;
          esac
          case "$(REAL_ZIG=/bin/echo binaries/zig-linux-compat.sh build-exe -Dtarget=aarch64-linux-musl)" in
            *"-Dtarget=aarch64-linux.4.1.0...4.1.0-musl"*) ;;
            *) echo "aarch64 -Dtarget= rewrite failed" >&2; exit 1 ;;
          esac

      - name: Build release binaries via Makefile
        run: |
          set -euo pipefail
          targets="${{ inputs.tools || 'update_sub_tool update_node_tool' }}"
          ZIG_COMPAT_VERBOSE=1 REAL_ZIG=/opt/zig-0.15.2/zig make -C binaries ${targets} 2>&1 | tee "$RUNNER_TEMP/zig-build.log"
          min_41_hits=0
          min_26_hits=0
          for zt in update_geotool update_sub_tool update_node_tool update_anytls_zig update_websocketd update_status_tool update_webtest_tool; do
            case " ${targets} " in
              *" ${zt} "*)
                min_41_hits=$((min_41_hits + 1))
                min_26_hits=$((min_26_hits + 1))
                ;;
            esac
          done
          case " ${targets} " in
            *" update_xapi_tool "*)
              min_41_hits=$((min_41_hits + 1))
              ;;
          esac
          if [ "${min_41_hits}" -gt 0 ]; then
            if grep -Eq 'Using Zig:' "$RUNNER_TEMP/zig-build.log"; then
              if grep -E 'Using Zig:' "$RUNNER_TEMP/zig-build.log" | grep -Evq 'binaries/zig-linux-compat\.sh \(0\.15\.2\)'; then
                echo "Build bypassed binaries/zig-linux-compat.sh or used wrong Zig version" >&2
                exit 1
              fi
            fi
            for triple in \
              aarch64-linux.4.1.0...4.1.0-musl \
              arm-linux.4.1.0...4.1.0-musleabi \
              arm-linux.4.1.0...4.1.0-musleabihf \
              x86_64-linux.4.1.0...4.1.0-musl
            do
              hits="$(grep -Fxc "[zig-linux-compat] effective target: ${triple}" "$RUNNER_TEMP/zig-build.log" || true)"
              echo "Effective target ${triple}: ${hits} invocation(s)"
              test "$hits" -ge "$min_41_hits"
            done
          fi
          if [ "${min_26_hits}" -gt 0 ]; then
            hits="$(grep -Fxc "[zig-linux-compat] effective target: arm-linux.2.6.36...2.6.36-musleabi" "$RUNNER_TEMP/zig-build.log" || true)"
            echo "Effective target arm-linux.2.6.36...2.6.36-musleabi: ${hits} invocation(s)"
            test "$hits" -ge "$min_26_hits"
          fi
          {
            echo "GEOTOOL_VERSION=$(tr -d '\r\n' < tool/geotool/VERSION)"
            echo "XAPI_TOOL_VERSION=$(tr -d '\r\n' < tool/xapi-tool/VERSION)"
            echo "SUB_TOOL_VERSION=$(tr -d '\r\n' < tool/sub-tool/VERSION)"
            echo "NODE_TOOL_VERSION=$(tr -d '\r\n' < tool/node-tool/VERSION)"
            echo "ANYTLS_ZIG_VERSION=$(tr -d '\r\n' < tool/anytls-zig/VERSION)"
            echo "WS_TOOL_VERSION=$(tr -d '\r\n' < tool/ws-tool/VERSION)"
            echo "STATUS_TOOL_VERSION=$(tr -d '\r\n' < tool/status-tool/VERSION)"
            echo "WEBTEST_TOOL_VERSION=$(tr -d '\r\n' < tool/webtest-tool/VERSION)"
            echo "BUILT_TARGETS=${targets}"
          } >> "$GITHUB_ENV"

      - name: Verify SHA256SUMS, Linux 4.1 syscall compatibility, and release binaries
        run: |
          set -euo pipefail
          # format: <dir>:<bin_prefix>:<ver>:<has_armv5>:<mode>
          tools_to_check=()
          case " ${BUILT_TARGETS} " in
            *" update_geotool "*) tools_to_check+=("geotool:geotool:${GEOTOOL_VERSION}:1:geotool") ;;
          esac
          case " ${BUILT_TARGETS} " in
            *" update_xapi_tool "*) tools_to_check+=("xapi-tool:xapi-tool:${XAPI_TOOL_VERSION}:0:xapi") ;;
          esac
          case " ${BUILT_TARGETS} " in
            *" update_sub_tool "*) tools_to_check+=("sub-tool:sub-tool:${SUB_TOOL_VERSION}:1:sub") ;;
          esac
          case " ${BUILT_TARGETS} " in
            *" update_node_tool "*) tools_to_check+=("node-tool:node-tool:${NODE_TOOL_VERSION}:1:node") ;;
          esac
          case " ${BUILT_TARGETS} " in
            *" update_anytls_zig "*) tools_to_check+=("anytls-zig:anytls-zig:${ANYTLS_ZIG_VERSION}:1:version") ;;
          esac
          case " ${BUILT_TARGETS} " in
            *" update_websocketd "*) tools_to_check+=("websocketd:websocketd:${WS_TOOL_VERSION}:1:version") ;;
          esac
          case " ${BUILT_TARGETS} " in
            *" update_status_tool "*)
              tools_to_check+=("status-tool:status-tool:${STATUS_TOOL_VERSION}:1:version")
              tools_to_check+=("status-tool:statusctl:${STATUS_TOOL_VERSION}:1:version")
              ;;
          esac
          case " ${BUILT_TARGETS} " in
            *" update_webtest_tool "*)
              tools_to_check+=("webtest-tool:webtest-tool:${WEBTEST_TOOL_VERSION}:1:version")
              tools_to_check+=("webtest-tool:webtestctl:${WEBTEST_TOOL_VERSION}:1:version")
              ;;
          esac

          mkdir -p "$RUNNER_TEMP/verify" "$RUNNER_TEMP/zig-tool-binaries"
          cat > "$RUNNER_TEMP/verify/run_linux41_seccomp.py" <<'PY'
          import ctypes, os, struct, sys

          PR_SET_NO_NEW_PRIVS = 38
          PR_SET_SECCOMP = 22
          SECCOMP_MODE_FILTER = 2
          AUDIT_ARCH_X86_64 = 0xC000003E
          SECCOMP_RET_ALLOW = 0x7FFF0000
          SECCOMP_RET_ERRNO_ENOSYS = 0x00050026

          blocked = [326, 327, 328, 332, 334, 435, 436, 437, 439]
          n = len(blocked)
          insns = [
              struct.pack("<HBBI", 0x20, 0, 0, 4),
              struct.pack("<HBBI", 0x15, 0, n + 1, AUDIT_ARCH_X86_64),
              struct.pack("<HBBI", 0x20, 0, 0, 0),
          ]
          for idx, nr in enumerate(blocked):
              insns.append(struct.pack("<HBBI", 0x15, n - idx, 0, nr))
          insns.append(struct.pack("<HBBI", 0x06, 0, 0, SECCOMP_RET_ALLOW))
          insns.append(struct.pack("<HBBI", 0x06, 0, 0, SECCOMP_RET_ERRNO_ENOSYS))

          buf = ctypes.create_string_buffer(b"".join(insns))

          class SockFprog(ctypes.Structure):
              _fields_ = [("len", ctypes.c_ushort), ("filter", ctypes.c_void_p)]

          prog = SockFprog(len(insns), ctypes.cast(buf, ctypes.c_void_p).value)
          libc = ctypes.CDLL("libc.so.6", use_errno=True)
          if libc.prctl(PR_SET_NO_NEW_PRIVS, 1, 0, 0, 0) != 0:
              raise OSError(ctypes.get_errno(), "PR_SET_NO_NEW_PRIVS")
          if libc.prctl(PR_SET_SECCOMP, SECCOMP_MODE_FILTER, ctypes.byref(prog), 0, 0) != 0:
              raise OSError(ctypes.get_errno(), "PR_SET_SECCOMP")
          os.execvp(sys.argv[1], sys.argv[1:])
          PY

          run_smoke_cmd() {
            local bin="$1"
            local mode="$2"
            local work="$3"
            local strace_log="${4:-}"
            local qemu_cmd="${5:-}"
            local -a prefix=()
            if [ -n "$qemu_cmd" ]; then
              prefix=("$qemu_cmd" -strace)
            fi
            rm -rf "$work"
            mkdir -p "$work"
            case "$mode" in
              sub)
                printf 'ss://YWVzLTI1Ni1nY206cGFzcw==@example.com:8388#TestNode\n' > "$work/uris.txt"
                : > "$work/prev.jsonl"
                if [ -n "$strace_log" ]; then
                  python3 "$RUNNER_TEMP/verify/run_linux41_seccomp.py" "${prefix[@]}" "$bin" parse-uri-lines \
                    --input "$work/uris.txt" --output "$work/out.jsonl" --format fancyss \
                    --compare-with "$work/prev.jsonl" --diff-output "$work/diff.txt" --summary-output "$work/summary.json" \
                    2>"$strace_log"
                else
                  python3 "$RUNNER_TEMP/verify/run_linux41_seccomp.py" "${prefix[@]}" "$bin" parse-uri-lines \
                    --input "$work/uris.txt" --output "$work/out.jsonl" --format fancyss \
                    --compare-with "$work/prev.jsonl" --diff-output "$work/diff.txt" --summary-output "$work/summary.json"
                fi
                test -s "$work/out.jsonl"
                test -s "$work/summary.json"
                test -f "$work/diff.txt"
                ;;
              node)
                printf '{"id":"n1"}\n' > "$work/keep.jsonl"
                printf '{"id":"n2"}\n' > "$work/stale.jsonl"
                printf 'keep_tag\n' > "$work/active.txt"
                printf '%s\t1\tkeep_tag\tKeep\n%s\t1\tstale_tag\tStale\n' "$work/keep.jsonl" "$work/stale.jsonl" > "$work/meta.tsv"
                if [ -n "$strace_log" ]; then
                  python3 "$RUNNER_TEMP/verify/run_linux41_seccomp.py" "${prefix[@]}" "$bin" prune-export-sources \
                    --meta "$work/meta.tsv" --active-source-tags "$work/active.txt" --format json \
                    >/dev/null 2>"$strace_log"
                else
                  python3 "$RUNNER_TEMP/verify/run_linux41_seccomp.py" "${prefix[@]}" "$bin" prune-export-sources \
                    --meta "$work/meta.tsv" --active-source-tags "$work/active.txt" --format json \
                    >/dev/null
                fi
                test -f "$work/keep.jsonl"
                test ! -e "$work/stale.jsonl"
                ;;
              geotool)
                if [ -n "$strace_log" ]; then
                  python3 "$RUNNER_TEMP/verify/run_linux41_seccomp.py" "${prefix[@]}" "$bin" stat -i fancyss/ss/rules_ng2/dat/geosite.dat -c google \
                    >"$work/stat.tsv" 2>"$strace_log"
                else
                  python3 "$RUNNER_TEMP/verify/run_linux41_seccomp.py" "${prefix[@]}" "$bin" stat -i fancyss/ss/rules_ng2/dat/geosite.dat -c google \
                    >"$work/stat.tsv"
                fi
                grep -Eq '^google[[:space:]]+[0-9]+' "$work/stat.tsv"
                ;;
              xapi)
                if [ -n "$strace_log" ]; then
                  python3 "$RUNNER_TEMP/verify/run_linux41_seccomp.py" "${prefix[@]}" "$bin" version >"$work/ver.txt" 2>"$strace_log"
                else
                  python3 "$RUNNER_TEMP/verify/run_linux41_seccomp.py" "${prefix[@]}" "$bin" version >"$work/ver.txt"
                fi
                test -s "$work/ver.txt"
                ;;
              version)
                if [ -n "$strace_log" ]; then
                  python3 "$RUNNER_TEMP/verify/run_linux41_seccomp.py" "${prefix[@]}" "$bin" --version >"$work/ver.txt" 2>"$strace_log"
                else
                  python3 "$RUNNER_TEMP/verify/run_linux41_seccomp.py" "${prefix[@]}" "$bin" --version >"$work/ver.txt" 2>&1
                fi
                ;;
            esac
          }

          checked_checksums=""
          for item in "${tools_to_check[@]}"; do
            IFS=':' read -r dir bin_prefix ver has_armv5 mode <<< "$item"
            echo "=== Verifying ${bin_prefix} v${ver} (binaries/${dir}) ==="
            if ! printf '%s\n' "$checked_checksums" | grep -Fxq "${dir}:${ver}"; then
              (cd "binaries/${dir}" && sha256sum -c "SHA256SUMS-v${ver}")
              checked_checksums="${checked_checksums}"$'\n'"${dir}:${ver}"
              mkdir -p "$RUNNER_TEMP/zig-tool-binaries/${dir}"
              cp -f "binaries/${dir}/SHA256SUMS-v${ver}" "$RUNNER_TEMP/zig-tool-binaries/${dir}/"
            fi

            arches="x86_64 aarch64 armv7a armv7hf"
            q_arches="aarch64 armv7hf"
            if [ "$has_armv5" = "1" ]; then
              arches="${arches} armv5te"
              q_arches="${q_arches} armv5te"
            fi
            for arch in ${arches}; do
              src="binaries/${dir}/${bin_prefix}-v${ver}-linux-${arch}"
              cp -f "$src" "$RUNNER_TEMP/zig-tool-binaries/${dir}/"
              dst="$RUNNER_TEMP/verify/${bin_prefix}-linux-${arch}"
              cp -f "$src" "$dst"
              chmod 0755 "$dst"
              if upx-5.0.2 -t "$dst" >/dev/null 2>&1; then
                upx-5.0.2 -d "$dst" >/dev/null
              elif upx-4.2.4 -t "$dst" >/dev/null 2>&1; then
                upx-4.2.4 -d "$dst" >/dev/null
              fi
            done

            x64_bin="$RUNNER_TEMP/verify/${bin_prefix}-linux-x86_64"
            objdump -d "$x64_bin" > "$RUNNER_TEMP/verify/${bin_prefix}-x86_64.asm"
            python3 - "$bin_prefix" "$RUNNER_TEMP/verify/${bin_prefix}-x86_64.asm" <<'PY'
          import re
          import sys

          tool, asm_path = sys.argv[1], sys.argv[2]
          pat = re.compile(r"\$0x146\b")
          with open(asm_path, "r", errors="replace") as f:
              lines = f.readlines()
          hit_indices = [i for i, line in enumerate(lines) if pat.search(line)]
          if tool == "sub-tool":
              if hit_indices:
                  for i in hit_indices:
                      print(f"{i + 1}: {lines[i].rstrip()}", file=sys.stderr)
                  raise SystemExit(f"Found forbidden copy_file_range ($0x146) in {asm_path}: {len(hit_indices)} hit(s)")
              print(f"{asm_path}: 0 hits for $0x146 (copy_file_range)")
          else:
              if len(hit_indices) > 1:
                  for i in hit_indices:
                      print(f"{i + 1}: {lines[i].rstrip()}", file=sys.stderr)
                  raise SystemExit(f"Expected <= 1 musl copy_file_range stub in {asm_path}, got {len(hit_indices)}")
              if len(hit_indices) == 1:
                  idx = hit_indices[0]
                  prev_ctx = "".join(lines[max(0, idx - 4) : idx])
                  next_ctx = "".join(lines[idx + 1 : min(len(lines), idx + 5)])
                  if not (("movslq" in prev_ctx or "movsxd" in prev_ctx) and "syscall" in next_ctx and "jmp" in next_ctx):
                      for j in range(max(0, idx - 4), min(len(lines), idx + 5)):
                          print(f"{j + 1}: {lines[j].rstrip()}", file=sys.stderr)
                      raise SystemExit(f"Non-musl copy_file_range ($0x146) call site in {asm_path}")
                  print(f"{asm_path}: 1 unreferenced musl copy_file_range C stub (verified via runtime seccomp/strace)")
              else:
                  print(f"{asm_path}: 0 hits for $0x146 (copy_file_range)")
          PY

            run_smoke_cmd "$x64_bin" "$mode" "$RUNNER_TEMP/verify/work-${bin_prefix}-x86_64"
            echo "${bin_prefix} (x86_64): seccomp ENOSYS runtime check passed"

            for qarch in ${q_arches}; do
              qbin="$RUNNER_TEMP/verify/${bin_prefix}-linux-${qarch}"
              if [ "$qarch" = "aarch64" ]; then
                qemu_cmd="qemu-aarch64"
              else
                qemu_cmd="qemu-arm"
              fi
              work="$RUNNER_TEMP/verify/work-${bin_prefix}-${qarch}"
              strace_log="$RUNNER_TEMP/verify/strace-${bin_prefix}-${qarch}.log"
              rm -f "$strace_log"
              run_smoke_cmd "$qbin" "$mode" "$work" "$strace_log" "$qemu_cmd"
              if [ "$mode" = "sub" ] || [ "$mode" = "node" ] || [ "$mode" = "geotool" ]; then
                grep -Eq 'openat\(' "$strace_log"
              fi
              if grep -Eq '(^|[[:space:]])(statx|faccessat2|copy_file_range|preadv2|pwritev2|openat2|close_range)\(' "$strace_log"; then
                grep -E '(^|[[:space:]])(statx|faccessat2|copy_file_range|preadv2|pwritev2|openat2|close_range)\(' "$strace_log" >&2
                echo "Forbidden post-4.1 syscall detected in ${bin_prefix} (${qarch}) strace!" >&2
                exit 1
              fi
              echo "${bin_prefix} (${qarch}): qemu + seccomp ENOSYS strace clean (0 post-4.1 syscalls)"
            done
          done

          case " ${BUILT_TARGETS} " in
            *" update_tuic_client "*)
              tuic_ver="$(tr -d '\r\n' < binaries/tuic-client/latest.txt)"
              echo "=== Verifying tuic-client ${tuic_ver} ==="
              test -n "${tuic_ver}"
              case "${tuic_ver}" in
                v1.*) ;;
                *) echo "Unexpected non-v1 tuic-client version: ${tuic_ver}" >&2; exit 1 ;;
              esac
              (cd "binaries/tuic-client/${tuic_ver}" && md5sum -c md5sum.txt)
              mkdir -p "$RUNNER_TEMP/zig-tool-binaries/tuic-client/${tuic_ver}"
              cp -f binaries/tuic-client/latest.txt "$RUNNER_TEMP/zig-tool-binaries/tuic-client/"
              cp -f "binaries/tuic-client/${tuic_ver}/"* "$RUNNER_TEMP/zig-tool-binaries/tuic-client/${tuic_ver}/"
              for arch in arm64 armv7; do
                qbin="$RUNNER_TEMP/verify/tuic-client_${arch}"
                cp -f "binaries/tuic-client/${tuic_ver}/tuic-client_${arch}" "$qbin"
                chmod 0755 "$qbin"
                if upx-5.0.2 -t "$qbin" >/dev/null 2>&1; then
                  upx-5.0.2 -d "$qbin" >/dev/null
                elif upx-4.2.4 -t "$qbin" >/dev/null 2>&1; then
                  upx-4.2.4 -d "$qbin" >/dev/null
                fi
                if [ "$arch" = "arm64" ]; then
                  qemu-aarch64 "$qbin" -V | grep -Eq "${tuic_ver#v}"
                else
                  qemu-arm "$qbin" -V | grep -Eq "${tuic_ver#v}"
                fi
              done
              ;;
          esac

          case " ${BUILT_TARGETS} " in
            *" update_smartdns "*)
              sd_ver="$(tr -d '\r\n' < binaries/smartdns/latest.txt)"
              echo "=== Verifying smartdns ${sd_ver} ==="
              test -n "${sd_ver}"
              case "${sd_ver}" in
                *-RC*|*-dev*|*-rc*|*nightly*) echo "Unexpected prerelease smartdns version: ${sd_ver}" >&2; exit 1 ;;
              esac
              (cd "binaries/smartdns/${sd_ver}" && md5sum -c md5sum.txt)
              mkdir -p "$RUNNER_TEMP/zig-tool-binaries/smartdns/${sd_ver}"
              cp -f binaries/smartdns/latest.txt "$RUNNER_TEMP/zig-tool-binaries/smartdns/"
              cp -f "binaries/smartdns/${sd_ver}/"* "$RUNNER_TEMP/zig-tool-binaries/smartdns/${sd_ver}/"
              for arch in arm64 armv7 armv5; do
                qbin="$RUNNER_TEMP/verify/smartdns_${arch}"
                cp -f "binaries/smartdns/${sd_ver}/smartdns_${arch}" "$qbin"
                chmod 0755 "$qbin"
                if upx-5.0.2 -t "$qbin" >/dev/null 2>&1; then
                  upx-5.0.2 -d "$qbin" >/dev/null
                elif upx-4.2.4 -t "$qbin" >/dev/null 2>&1; then
                  upx-4.2.4 -d "$qbin" >/dev/null
                fi
                if [ "$arch" = "arm64" ]; then
                  qemu-aarch64 "$qbin" -v | grep -Eiq "smartdns"
                else
                  qemu-arm "$qbin" -v | grep -Eiq "smartdns"
                fi
              done
              ;;
          esac

      - name: Upload rebuilt tool and release binaries
        uses: actions/upload-artifact@v4
        with:
          name: zig-tool-binaries
          path: ${{ runner.temp }}/zig-tool-binaries
          retention-days: 7
