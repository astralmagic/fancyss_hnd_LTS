name: Sync P0 artifacts

on:
  push:
    branches:
      - candidate/p0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[sync-p0]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/p0
          submodules: false

      - uses: actions/download-artifact@v4
        with:
          name: xray-v26.11.9
          path: binaries/xray/v26.11.9-676eaf6
          run-id: 43679528327
          github-token: ${{ github.token }}

      - name: Sync Xray artifacts to every platform
        run: |
          set -euo pipefail
          for platform in hnd_v8 mtk ipq64; do
            cp -f binaries/xray/v26.11.9-676eaf6/xray_arm64 "fancyss/bin-${platform}/xray"
          done
          for platform in hnd qca ipq32; do
            cp -f binaries/xray/v26.11.9-676eaf6/xray_armv7 "fancyss/bin-${platform}/xray"
          done
          cp -f binaries/xray/v26.11.9-676eaf6/xray_armv5 fancyss/bin-arm/xray
          sed -i 's|WORK="$work" sh "$work/test.sh"|WORK="$work" bash "$work/test.sh"|' .github/workflows/build-release.yml
          test "$(cat binaries/xray/latest_2.txt)" = "v26.11.9-676eaf6"
          (cd binaries/xray/v26.11.9-676eaf6 && md5sum -c md5sum.txt)

      - name: Commit synchronized artifacts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add binaries/xray fancyss .github/workflows/build-release.yml
          if git diff --cached --quiet; then
            echo 'All artifacts already synchronized.'
            exit 0
          fi
          git commit -m 'Complete Xray platform synchronization (#1 #16)'
          git push origin HEAD:candidate/p0
