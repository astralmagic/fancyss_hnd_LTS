name: Update rules_ng

on:
  schedule:
    # Daily at 03:00 UTC+8 (1 hour before default 04:00 router auto-update)
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rules-ng
  cancel-in-progress: false

jobs:
  update-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: lts

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gzip jq python3

      - name: Refresh rules_ng from active upstream sources
        run: |
          bash -n rules_ng/update_rules.sh
          NO_PROGRESS=1 bash rules_ng/update_rules.sh update

      - name: Sync rules_ng into package mirror
        run: |
          set -euo pipefail
          for f in \
            gfwlist.gz \
            chnlist.gz \
            adslist.gz \
            udplist.txt \
            rotlist.txt \
            white_list.txt \
            black_list.txt \
            block_list.txt \
            apple_china.txt \
            google_china.txt \
            cdn_test.txt \
            chnroute.txt \
            chnroute6.txt \
            rules.json.js
          do
            cp -f "rules_ng/${f}" "fancyss/ss/rules/${f}"
          done

      - name: Verify rule manifests and update script tests
        run: |
          python3 -m unittest tests.test_p1_regressions.AssetTests tests.test_p1_regressions.RuleUpdateTests -v

      - name: Commit and push updated rules
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- rules_ng fancyss/ss/rules)" ]; then
            echo "No rule changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules_ng fancyss/ss/rules
          git commit -m "chore(rules): refresh rules_ng assets ($(TZ=CST-8 date +'%Y-%m-%d'))"
          git push origin HEAD:lts
