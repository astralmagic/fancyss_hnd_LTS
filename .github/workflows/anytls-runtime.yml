name: AnyTLS runtime regression

on:
  push:
    paths: ['tool/anytls-go/**', 'tests/**', 'build.sh', 'fancyss/install.sh', 'fancyss/res/shunt_manifest.json.js', 'fancyss/scripts/**', 'fancyss/ss/**', 'fancyss/webs/Module_shadowsocks.asp', 'binaries/Makefile', 'binaries/tuic-client/**', 'binaries/smartdns/**', 'doc/analysis/p2_hnd_v8_stability_triage.md', 'rules_ng/**', 'rules_ng2/**', 'scripts/**', '.github/workflows/anytls-runtime.yml']
  pull_request:
    paths: ['tool/anytls-go/**', 'tests/**', 'build.sh', 'fancyss/install.sh', 'fancyss/res/shunt_manifest.json.js', 'fancyss/scripts/**', 'fancyss/ss/**', 'fancyss/webs/Module_shadowsocks.asp', 'binaries/Makefile', 'binaries/tuic-client/**', 'binaries/smartdns/**', 'doc/analysis/p2_hnd_v8_stability_triage.md', 'rules_ng/**', 'rules_ng2/**', 'scripts/**', '.github/workflows/anytls-runtime.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /build.sh
            /tool/anytls-go/
            /tests/
            /fancyss/install.sh
            /fancyss/scripts/
            /fancyss/ss/
            /fancyss/webs/Module_shadowsocks.asp
            /fancyss/res/shunt_manifest.json.js
            /fancyss/res/ss-menu.js
            /binaries/Makefile
            /binaries/tuic-client/get_latest.sh
            /binaries/tuic-client/latest.txt
            /binaries/smartdns/get_smartdns.sh
            /binaries/smartdns/latest.txt
            /doc/analysis/p2_hnd_v8_stability_triage.md
            /rules_ng/
            /rules_ng2/
            /scripts/
            /.github/workflows/build-zig-tools.yml
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: tool/anytls-go/go.sum
      - name: Verify Go dependencies and unit tests
        working-directory: tool/anytls-go
        run: |
          go mod download
          go mod verify
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=3 -timeout 90s ./...
      - name: Shell syntax and fixture integration
        run: |
          bash -n build.sh binaries/tuic-client/get_latest.sh binaries/smartdns/get_smartdns.sh fancyss/scripts/ss_base.sh fancyss/scripts/ss_proc_status.sh fancyss/ss/ssconfig.sh tool/anytls-go/scripts/build-release.sh
          sh -n fancyss/install.sh fancyss/scripts/ss_node_common.sh fancyss/scripts/ss_node_subscribe.sh fancyss/scripts/ss_webtest_gen.sh fancyss/scripts/ss_status.sh fancyss/scripts/ss_rule_update.sh fancyss/scripts/ss_subscribe_profile_lib.sh fancyss/scripts/ss_shunt_stats.sh
          python3 tests/test_p1_regressions.py -v
          python3 tests/test_p2_regressions.py -v
          python3 tests/test_anytls_integration.py -v
      - name: Race-instrumented CLI workload
        env:
          ANYTLS_BIN: ${{ github.workspace }}/tool/anytls-go/dist/anytls-zig-race
          ANYTLS_SOAK_SECONDS: '5'
          GORACE: halt_on_error=1
        run: |
          cd tool/anytls-go
          go build -race -o dist/anytls-zig-race .
          cd ../..
          python3 tests/test_anytls_runtime.py -v \
            AnyTLSRuntimeTests.test_128_negotiated_connections_and_responsive_probe \
            AnyTLSRuntimeTests.test_upstream_disconnect_allows_new_sessions \
            AnyTLSRuntimeTests.test_repeated_close_batches_allow_new_connections \
            AnyTLSRuntimeTests.test_short_concurrent_soak
      - name: Native CLI load, reconnect and resource cleanup
        env:
          ANYTLS_SOAK_SECONDS: '30'
        run: |
          cd tool/anytls-go
          go build -o dist/anytls-zig-native .
          cd ../..
          python3 -m unittest discover -s tests -v
      - name: Cross-build supported architectures
        run: bash tool/anytls-go/scripts/build-release.sh --no-upx
